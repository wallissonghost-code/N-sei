<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>RPG de Bolso</title>
<style>*{box-sizing:border-box}body{margin:0;background:#15251c;color:#fff;font-family:system-ui;overflow:hidden}canvas{display:block;width:100vw;height:100dvh;image-rendering:pixelated}#hud{position:fixed;top:12px;left:12px;background:#15251cdd;padding:10px;border-radius:12px;font-size:14px}#controls{position:fixed;bottom:18px;left:18px;display:grid;grid-template-columns:repeat(3,54px);gap:5px;touch-action:none}button{border:1px solid #ffffff55;border-radius:12px;background:#1e342bcf;color:white;font-size:22px;height:54px}#attack{position:fixed;right:20px;bottom:40px;width:76px;height:76px;border-radius:50%;background:#b34b39}#tip{position:fixed;top:12px;right:12px;font-size:12px;color:#e1efdf}</style></head>
<body><canvas id="game"></canvas><div id="hud"></div><div id="tip">WASD / setas • Espaço: atacar</div><div id="controls"><span></span><button data-dir="up">▲</button><span></span><button data-dir="left">◀</button><button data-dir="down">▼</button><button data-dir="right">▶</button></div><button id="attack">⚔</button>
<script>
const c=document.querySelector('#game'),g=c.getContext('2d'),hud=document.querySelector('#hud'),T=32,W=50,H=38;
let player={x:25,y:19,hp:100,maxHp:100,xp:0,level:1,kills:0,face:'down'},keys=new Set(),monsters=[],lastAttack=0,flash=0;
const rand=(x,y)=>{let n=Math.sin(x*127.1+y*311.7)*43758.5453;return n-Math.floor(n)};
const map=Array.from({length:H},(_,y)=>Array.from({length:W},(_,x)=>{let r=rand(x,y);return r<.13?2:r<.22?1:0}));
for(let y=16;y<23;y++)for(let x=21;x<30;x++)map[y][x]=0;
function blocked(x,y){return x<0||y<0||x>=W||y>=H||map[y][x]===2}
function spawn(){for(let i=0;i<25;i++){let x=2+Math.floor(Math.random()*(W-4)),y=2+Math.floor(Math.random()*(H-4));if(!blocked(x,y)&&Math.hypot(x-player.x,y-player.y)>5){monsters.push({x,y,hp:3,step:0});return}}}
for(let i=0;i<12;i++)spawn();
function attack(){let now=performance.now();if(now-lastAttack<350)return;lastAttack=now;flash=now+150;let target=monsters.find(m=>Math.hypot(m.x-player.x,m.y-player.y)<1.7);if(target){target.hp--;if(target.hp<=0){monsters.splice(monsters.indexOf(target),1);player.kills++;player.xp+=10;if(player.xp>=player.level*30){player.xp=0;player.level++;player.maxHp+=10;player.hp=player.maxHp}setTimeout(spawn,1000)}}}
document.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();keys.add(e.key.toLowerCase());if(e.key===' ')attack()});document.addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));
document.querySelectorAll('[data-dir]').forEach(b=>{let d=b.dataset.dir;b.addEventListener('pointerdown',e=>{e.preventDefault();keys.add(d);b.setPointerCapture(e.pointerId)});for(let ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>keys.delete(d))});
document.querySelector('#attack').addEventListener('pointerdown',attack);
function resize(){c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;g.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}addEventListener('resize',resize);resize();
let last=0,move=0,enemyTick=0;
function frame(t){let dt=Math.min(50,t-last);last=t;move+=dt;enemyTick+=dt;
if(move>110){let dx=0,dy=0;if(keys.has('a')||keys.has('arrowleft')||keys.has('left'))dx=-1;else if(keys.has('d')||keys.has('arrowright')||keys.has('right'))dx=1;else if(keys.has('w')||keys.has('arrowup')||keys.has('up'))dy=-1;else if(keys.has('s')||keys.has('arrowdown')||keys.has('down'))dy=1;
if(dx||dy){player.face=dx<0?'left':dx>0?'right':dy<0?'up':'down';if(!blocked(player.x+dx,player.y+dy)&&!monsters.some(m=>m.x===player.x+dx&&m.y===player.y+dy)){player.x+=dx;player.y+=dy}}move=0}
if(enemyTick>850){for(let m of monsters){if(Math.hypot(m.x-player.x,m.y-player.y)<1.5){player.hp=Math.max(0,player.hp-3)}else if(Math.hypot(m.x-player.x,m.y-player.y)<7){let dx=Math.sign(player.x-m.x),dy=Math.sign(player.y-m.y);if(Math.random()<.5)dy=0;else dx=0;if(!blocked(m.x+dx,m.y+dy)&&!(m.x+dx===player.x&&m.y+dy===player.y)&&!monsters.some(o=>o!==m&&o.x===m.x+dx&&o.y===m.y+dy)){m.x+=dx;m.y+=dy}}}enemyTick=0}
if(player.hp<=0){player.hp=player.maxHp;player.x=25;player.y=19}
let sw=innerWidth,sh=innerHeight,ox=sw/2-player.x*T-T/2,oy=sh/2-player.y*T-T/2;
g.clearRect(0,0,sw,sh);
for(let y=Math.max(0,Math.floor(-oy/T));y<Math.min(H,Math.ceil((sh-oy)/T));y++)for(let x=Math.max(0,Math.floor(-ox/T));x<Math.min(W,Math.ceil((sw-ox)/T));x++){let px=ox+x*T,py=oy+y*T;g.fillStyle=(x+y)%2?'#5d9d55':'#65a65a';g.fillRect(px,py,T,T);if(map[y][x]===1){g.fillStyle='#b49a69';g.fillRect(px,py,T,T)}if(map[y][x]===2){g.fillStyle='#305d32';g.fillRect(px+2,py+5,28,25);g.fillStyle='#3e7840';g.fillRect(px+5,py,22,24);g.fillStyle='#704a2c';g.fillRect(px+13,py+22,6,10)}}
for(let m of monsters){let x=ox+m.x*T,y=oy+m.y*T;g.fillStyle='#4b8235';g.beginPath();g.ellipse(x+16,y+19,12,11,0,0,Math.PI*2);g.fill();g.fillStyle='#fff';g.fillRect(x+10,y+13,4,4);g.fillRect(x+19,y+13,4,4);g.fillStyle='#202d1b';g.fillRect(x+11,y+14,2,2);g.fillRect(x+20,y+14,2,2)}
let px=sw/2-16,py=sh/2-16;g.fillStyle='#283a8e';g.fillRect(px+8,py+13,16,17);g.fillStyle='#eac6a1';g.fillRect(px+9,py+5,14,13);g.fillStyle='#493125';g.fillRect(px+7,py+2,18,7);g.fillStyle='#181818';g.fillRect(px+12,py+12,3,3);g.fillRect(px+20,py+12,3,3);if(t<flash){g.strokeStyle='#fff5aa';g.lineWidth=5;g.beginPath();g.arc(sw/2,sh/2,28,-1,1);g.stroke()}
hud.innerHTML='❤️ '+player.hp+'/'+player.maxHp+' &nbsp; ⭐ Nível '+player.level+'<br>XP: '+player.xp+'/'+(player.level*30)+' &nbsp; 👾 '+player.kills+' derrotados';
requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></body></html>
